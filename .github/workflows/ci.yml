name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cxx }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-18]
        build_type: [Debug, Release]
        include:
          - cxx: g++-14
            pkg: g++-14
          - cxx: clang++-18
            pkg: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev ${{ matrix.pkg }}

      # Optional: enables bench_small_sort / bench_small_sort_dyn.  If this fails
      # (e.g. transient network), CMake just skips those two targets -- the rest
      # of the build is unaffected.
      - name: Fetch cpp-sort (for the comparison benchmarks)
        continue-on-error: true
        run: |
          rm -rf third_party/cpp-sort
          git clone --filter=blob:none https://github.com/Morwenn/cpp-sort third_party/cpp-sort
          git -C third_party/cpp-sort checkout 4e2396811ac61bc9ce6a3373c5f6a98a72bb34ff

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPARTITIONS_NATIVE=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test tools (Release only)
        if: matrix.build_type == 'Release'
        run: |
          ./build/benchmarks/bench_partition quick   > /dev/null
          ./build/benchmarks/bench_pivot quick        > /dev/null
          ./build/tools/balance_report 20             > /dev/null
          ./build/tools/verify_small_sort                          # exhaustive 0/1 + key-only
          ./build/benchmarks/bench_small_merge check               # extend/merge correctness
          echo "tools ran successfully"

  format:
    name: clang-format (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        continue-on-error: true
        run: |
          files=$(find include tests benchmarks tools \( -name '*.hpp' -o -name '*.cpp' \))
          clang-format-18 --dry-run --Werror $files
